# Creates a paid service with a persistent disk. Review Render's quote before deploying.
services:
  - type: web
    name: duckduck-test
    runtime: docker
    plan: starter
    region: singapore
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    dockerCommand: >-
      sh -c 'export PUBLIC_ORIGIN="${RENDER_EXTERNAL_URL:?Missing Render public URL}"; exec node server.js'
    disk:
      name: duckduck-data
      mountPath: /var/lib/duckduck
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/lib/duckduck
      - key: BACKUP_DIR
        value: /var/lib/duckduck/backups
      - key: BACKUP_ENABLED
        value: "1"
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: BACKUP_RETENTION_DAYS
        value: "14"
