# Free web service; persistent data lives in a separately configured Turso free database.
services:
  - type: web
    name: duckduck-test
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    dockerCommand: >-
      sh -c 'export PUBLIC_ORIGIN="${RENDER_EXTERNAL_URL:?Missing Render public URL}"; exec node server.js'
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /tmp/duckduck
      - key: BACKUP_DIR
        value: /tmp/duckduck/backups
      - key: BACKUP_ENABLED
        value: "0"
      - key: STORE_DRIVER
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INTEGRATION_KEY_SEED
        generateValue: true
