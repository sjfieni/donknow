services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      DATA_DIR: /var/lib/duckduck
      BACKUP_DIR: /var/backups/duckduck
      BACKUP_ENABLED: "1"
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_RETENTION_DAYS: "14"
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_BASIC_AUTH: ${NOTION_BASIC_AUTH:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY:-}
    volumes:
      - app-data:/var/lib/duckduck
      - app-backups:/var/backups/duckduck
    networks:
      - internal
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
networks:
  internal:
volumes:
  app-data:
  app-backups:
  gateway-data:
  gateway-config:
